@if (line()) {
  <div class="overlay" (click)="dialogue.next()">
    @if (fullPortrait(); as full) {
      <img class="portrait full" [src]="full" alt="" />
    }
    @if (!character()?.portraitFull && character()?.portrait) {
      <img class="portrait" [src]="character()?.portrait" [alt]="character()?.name" />
    }
    <div class="box" [class.narrator]="!character()">
      @if (character(); as c) {
        <div class="name" [style.color]="c.color">{{ c.name }}</div>
      }
      <p class="text">{{ text() }}</p>

      @if (choices().length) {
        <div class="choices">
          @for (choice of choices(); track $index) {
            <button type="button" (click)="$event.stopPropagation(); choose(choice)">
              {{ choice.text }}
            </button>
          }
        </div>
      } @else {
        <span class="continue" aria-hidden="true">▼</span>
      }
    </div>
  </div>
}
